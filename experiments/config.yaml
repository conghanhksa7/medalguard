configs:
  C0: "Baseline (no check)"
  C1: "dbt contracts only"
  C2: "Great Expectations only"
  C3: "MedalGuard full (dbt + GX + MedalGuard)"
  C3_standalone: "MedalGuard only (no dbt contracts, no GX) - for clean ablation"

ablation:
  - A1_NO_SCHEMA: "constraint + semantic only"
  - A2_NO_CONSTRAINT: "schema + semantic only"
  - A3_NO_SEMANTIC: "schema + constraint only"
  - A4_SCHEMA_ONLY: "schema only"
  - A5_CONSTRAINT_ONLY: "constraint only"
  - A6_SEMANTIC_ONLY: "semantic only"

execution:
  repeat_count: 7
  stress_test:
    - 0.1
    - 1
    - 5
  randomize_order: true
  cold_start: true

metrics:
  - precision
  - recall
  - f1_score
  - detection_depth
  - blast_radius
  - overhead_ms
  - pipeline_status
  - measurement_type
